    .topbar{position:fixed;z-index:2;top:22px;left:26px;right:26px;display:flex;align-items:center;justify-content:space-between;pointer-events:none}.brand{display:flex;align-items:center;gap:10px;font-size:11px;letter-spacing:.2em;font-weight:800}.brand-mark{width:30px;height:30px;border:1px solid #67efff88;border-radius:9px;display:grid;place-items:center;color:var(--cyan);transform:rotate(45deg);box-shadow:0 0 22px #67efff33}.brand-mark span{transform:rotate(-45deg);font-size:15px}.hud{display:flex;gap:8px}.hud-card{min-width:91px;padding:9px 12px;border:1px solid #b6d8ed20;background:var(--panel);backdrop-filter:blur(12px);border-radius:11px}.hud-card small{display:block;color:var(--muted);font-size:9px;letter-spacing:.12em;margin-bottom:4px}.hud-card strong{font:700 18px/1.05 ui-monospace,SFMono-Regular,monospace}.hud-card em{font-style:normal;color:var(--cyan);font-size:9px;margin-left:4px}

<body>
  <canvas id="game" aria-label="俯视街机赛车游戏"></canvas><div class="grain"></div>
  <header class="topbar">
    <div class="brand"><div class="brand-mark"><span>↗</span></div><span>VOLT / STREET CIRCUIT</span></div>
    <div class="hud">
      <div class="hud-card"><small>圈数</small><strong id="lap">01<em>/03</em></strong></div>
      <div class="hud-card"><small>排名</small><strong id="position">06<em>/06</em></strong></div>
      <div class="hud-card"><small>速度</small><strong id="speed">000<em>KM/H</em></strong></div>
      <div class="hud-card"><small>最佳圈速</small><strong id="best">--<em>SEC</em></strong></div>
    </div>
  </header>
  <main class="content" id="intro">
    <div class="eyebrow">ARCADE RACING / 01</div>
    <h1>把弯道<span>开成直线。</span></h1>
    <p class="intro">踩住油门，在霓虹街道上和 5 位车手跑完 3 圈。控制赛车走线、抢内线超车，冲过终点刷新圈速。</p>
    <div class="keys"><span class="key">W / ↑</span><span class="key-label">油门</span><span class="key">S / ↓</span><span class="key-label">刹车</span><span class="key">A D / ← →</span><span class="key-label">方向</span></div>
    <button class="cta" id="start">开始比赛 <span class="arrow">↗</span></button>
    <div class="hint">赛道固定 · 赛车沿赛道真实移动 · 圈速纪录保存在本地</div>
  </main>
  <div class="countdown" id="countdown"></div>
  <div class="right-note"><b>3 LAPS · 6 DRIVERS</b>FIND THE FAST LINE</div>
  <div class="speed-line" id="status"><b>READY</b> · 选择走线，准备发车</div>
  <div class="touch-controls" aria-label="赛车控制">
    <button id="left" aria-label="向左转">←</button>
    <button class="brake" id="brake" aria-label="刹车">刹车</button>
    <button class="pedal" id="gas" aria-label="油门">油门</button>
    <button id="right" aria-label="向右转">→</button>
  </div>
  <script>
    (()=>{
      const canvas=document.querySelector('#game'),ctx=canvas.getContext('2d');
      const intro=document.querySelector('#intro'),statusEl=document.querySelector('#status'),countdownEl=document.querySelector('#countdown');
      const lapEl=document.querySelector('#lap'),positionEl=document.querySelector('#position'),speedEl=document.querySelector('#speed'),bestEl=document.querySelector('#best');
      const W=1000,H=900,ROAD=142,LAPS=3;
      const knots=[[184,655],[168,525],[174,405],[200,315],[270,247],[380,213],[505,211],[630,226],[733,269],[800,350],[818,445],[800,526],[750,583],[671,617],[608,676],[535,738],[416,759],[307,735],[225,698]];
      const state={w:0,h:0,dpr:1,scale:1,cx:0,cy:0,portrait:false,time:0,last:0,mode:'ready',countdown:3,speed:0,lane:0,progress:0,left:false,right:false,gas:false,brake:false,handbrake:false,hit:0,bestLap:0,lapStart:0,raceStart:0,raceTime:0,player:null,cars:[]};
      const colors=['#c8ff69','#67efff','#ff5268','#ffb84d','#ad84ff','#f2f6fb'];
      const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
      const mod=(x,n)=>((x%n)+n)%n;
      try{state.bestLap=Number(localStorage.getItem('volt-race-best-lap'))||0}catch{}
      function formatTime(sec){if(!sec)return '--';return (sec/1000).toFixed(2)}
      function resize(){state.dpr=Math.min(devicePixelRatio||1,2);state.w=innerWidth;state.h=innerHeight;canvas.width=state.w*state.dpr;canvas.height=state.h*state.dpr;ctx.setTransform(state.dpr,0,0,state.dpr,0,0);state.portrait=state.h>state.w;const usableW=state.w-40,usableH=state.h-(state.portrait?170:128),worldW=state.portrait?H:W,worldH=state.portrait?W:H;state.scale=Math.min(usableW/worldW,usableH/worldH);state.cx=state.w/2;state.cy=(state.portrait?state.h*.53:state.h*.52)}
      function map(p){if(state.portrait)return{x:state.cx+(p.y-H/2)*state.scale,y:state.cy+(W/2-p.x)*state.scale};return{x:state.cx+(p.x-W/2)*state.scale,y:state.cy+(p.y-H/2)*state.scale}}
      function buildTrack(){const pts=[];for(let i=0;i<knots.length;i++){const p0=knots[mod(i-1,knots.length)],p1=knots[i],p2=knots[(i+1)%knots.length],p3=knots[(i+2)%knots.length];for(let j=0;j<28;j++){const t=j/28,t2=t*t,t3=t2*t;pts.push({x:.5*(2*p1[0]+(-p0[0]+p2[0])*t+(2*p0[0]-5*p1[0]+4*p2[0]-p3[0])*t2+(-p0[0]+3*p1[0]-3*p2[0]+p3[0])*t3),y:.5*(2*p1[1]+(-p0[1]+p2[1])*t+(2*p0[1]-5*p1[1]+4*p2[1]-p3[1])*t2+(-p0[1]+3*p1[1]-3*p2[1]+p3[1])*t3)})}}
        let length=0;for(let i=0;i<pts.length;i++){const a=pts[i],b=pts[(i+1)%pts.length];a.tx=b.x-a.x;a.ty=b.y-a.y;const d=Math.hypot(a.tx,a.ty);length+=d;a.s=length}const first=pts[0];first.s=0;for(let i=1;i<pts.length;i++){const a=pts[i-1],b=pts[i];b.s=a.s+Math.hypot(b.x-a.x,b.y-a.y)}return{pts,length:pts[pts.length-1].s+Math.hypot(pts[0].x-pts.at(-1).x,pts[0].y-pts.at(-1).y)}}
      const track=buildTrack();
      function pointAt(progress,lane=0){const d=mod(progress,1)*track.length,pts=track.pts;let lo=0,hi=pts.length-1;while(lo<hi){const mid=(lo+hi)>>1;if(pts[mid].s<d)lo=mid+1;else hi=mid}const b=pts[lo],a=pts[(lo-1+pts.length)%pts.length],span=(b.s-a.s+track.length)%track.length||1,t=mod(d-a.s,track.length)/span,x=a.x+(b.x-a.x)*t,y=a.y+(b.y-a.y)*t,dx=b.x-a.x,dy=b.y-a.y,len=Math.hypot(dx,dy)||1,tx=dx/len,ty=dy/len,nx=-ty,ny=tx;return{x:x+nx*lane*ROAD*.37,y:y+ny*lane*ROAD*.37,tx,ty,nx,ny,angle:Math.atan2(ty,tx)+Math.PI/2}}
      function pathTrack(){ctx.beginPath();for(let i=0;i<track.pts.length;i++){const p=map(track.pts[i]);if(i===0)ctx.moveTo(p.x,p.y);else ctx.lineTo(p.x,p.y)}ctx.closePath()}
      function drawBackground(){const g=ctx.createLinearGradient(0,0,0,state.h);g.addColorStop(0,'#10232d');g.addColorStop(.55,'#142b31');g.addColorStop(1,'#071116');ctx.fillStyle=g;ctx.fillRect(0,0,state.w,state.h);const glow=ctx.createRadialGradient(state.w*.5,state.h*.5,0,state.w*.5,state.h*.5,Math.max(state.w,state.h)*.72);glow.addColorStop(0,'#91dc6812');glow.addColorStop(1,'#07111600');ctx.fillStyle=glow;ctx.fillRect(0,0,state.w,state.h);ctx.strokeStyle='#c0ead009';ctx.lineWidth=1;const step=42;for(let x=0;x<state.w;x+=step){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,state.h);ctx.stroke()}for(let y=0;y<state.h;y+=step){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(state.w,y);ctx.stroke()}for(let i=0;i<26;i++){const x=mod(i*137,state.w),y=mod(i*239,state.h);ctx.fillStyle=i%3?'#d9f1d31b':'#c8ff6940';ctx.fillRect(x,y,2,2)}}
      function drawTrack(){const roadPx=ROAD*state.scale;pathTrack();ctx.lineJoin='round';ctx.lineCap='round';ctx.strokeStyle='#05090d';ctx.lineWidth=roadPx+34*state.scale;ctx.stroke();const n=track.pts.length,step=Math.max(3,Math.floor(n/76));for(let i=0;i<n;i+=step){ctx.beginPath();for(let j=0;j<=step;j++){const p=map(track.pts[(i+j)%n]);if(j===0)ctx.moveTo(p.x,p.y);else ctx.lineTo(p.x,p.y)}ctx.strokeStyle=(Math.floor(i/step)%2)?'#e9eee8':'#f44f5d';ctx.lineWidth=roadPx+18*state.scale;ctx.stroke()}pathTrack();ctx.strokeStyle='#37434b';ctx.lineWidth=roadPx;ctx.stroke();pathTrack();ctx.strokeStyle='#7b878d';ctx.lineWidth=2.2*state.scale;ctx.setLineDash([12*state.scale,13*state.scale]);ctx.stroke();ctx.setLineDash([]);pathTrack();ctx.strokeStyle='#dce6df70';ctx.lineWidth=1*state.scale;ctx.setLineDash([2*state.scale,17*state.scale]);ctx.stroke();ctx.setLineDash([]);const start=pointAt(0),p=map(start),half=ROAD*.5*state.scale;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(start.angle-(state.portrait?Math.PI/2:0));const cell=9*state.scale,thick=10*state.scale;for(let row=0;row<2;row++)for(let col=0;col<Math.ceil(half*2/cell);col++){ctx.fillStyle=(row+col)%2?'#f3f5ee':'#14191d';ctx.fillRect(-half+col*cell,-thick/2+row*thick/2,cell,thick/2)}ctx.restore();ctx.save();ctx.globalAlpha=.6;for(let i=0;i<12;i++){const p=map(track.pts[i*10]);ctx.fillStyle=i%2?'#67efff':'#c8ff69';ctx.shadowColor=ctx.fillStyle;ctx.shadowBlur=12;ctx.beginPath();ctx.arc(p.x,p.y,2.2*state.scale,0,Math.PI*2);ctx.fill()}ctx.restore()}
      function drawCar(car,isPlayer=false){const p=pointAt(car.progress,car.lane),q=map(p),scale=state.scale*(isPlayer?1:.94),len=40*scale,wid=21*scale,angle=p.angle-(state.portrait?Math.PI/2:0);ctx.save();ctx.translate(q.x,q.y);ctx.rotate(angle);ctx.globalAlpha=car.finished?.65:1;ctx.shadowColor=isPlayer?'#c8ff69aa':'#000';ctx.shadowBlur=isPlayer?14:6;ctx.fillStyle='#020609';ctx.beginPath();ctx.ellipse(0,2*scale,wid*.72,len*.63,0,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;
        // Four separate tires and rims keep the car readable from above.
        for(const sx of [-1,1])for(const sy of [-1,1]){const tx=sx*wid*.48,ty=sy*len*.29;ctx.fillStyle='#080b0d';ctx.beginPath();ctx.roundRect(tx-wid*.16,ty-len*.105,wid*.32,len*.21,2*scale);ctx.fill();ctx.fillStyle='#87959a';ctx.beginPath();ctx.ellipse(tx,ty,wid*.075,len*.055,0,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#e2e9e9';ctx.lineWidth=1*scale;ctx.stroke()}
        ctx.fillStyle=car.color;ctx.beginPath();ctx.moveTo(-wid*.32,-len*.46);ctx.quadraticCurveTo(-wid*.37,-len*.37,-wid*.4,-len*.15);ctx.lineTo(-wid*.43,len*.25);ctx.quadraticCurveTo(-wid*.38,len*.43,-wid*.2,len*.47);ctx.lineTo(wid*.2,len*.47);ctx.quadraticCurveTo(wid*.38,len*.43,wid*.43,len*.25);ctx.lineTo(wid*.4,-len*.15);ctx.quadraticCurveTo(wid*.37,-len*.37,wid*.32,-len*.46);ctx.quadraticCurveTo(0,-len*.53,-wid*.32,-len*.46);ctx.closePath();ctx.fill();ctx.strokeStyle=isPlayer?'#ecffb7':'#ffffff85';ctx.lineWidth=1*scale;ctx.stroke();ctx.fillStyle='#08151d';ctx.beginPath();ctx.moveTo(-wid*.27,-len*.22);ctx.quadraticCurveTo(-wid*.22,-len*.36,0,-len*.37);ctx.quadraticCurveTo(wid*.22,-len*.36,wid*.27,-len*.22);ctx.lineTo(wid*.3,-len*.02);ctx.quadraticCurveTo(0,len*.03,-wid*.3,-len*.02);ctx.closePath();ctx.fill();ctx.fillStyle='#152832';ctx.beginPath();ctx.moveTo(-wid*.29,len*.08);ctx.lineTo(wid*.29,len*.08);ctx.lineTo(wid*.25,len*.29);ctx.quadraticCurveTo(0,len*.34,-wid*.25,len*.29);ctx.closePath();ctx.fill();ctx.strokeStyle='#dff8ff77';ctx.lineWidth=.8*scale;ctx.beginPath();ctx.moveTo(-wid*.26,-len*.03);ctx.lineTo(wid*.26,-len*.03);ctx.stroke();ctx.fillStyle='#fff1bc';ctx.fillRect(-wid*.31,-len*.45,wid*.17,2.2*scale);ctx.fillRect(wid*.14,-len*.45,wid*.17,2.2*scale);ctx.fillStyle='#ff4352';ctx.shadowColor='#ff2438';ctx.shadowBlur=6*scale;ctx.fillRect(-wid*.32,len*.37,wid*.2,2.4*scale);ctx.fillRect(wid*.12,len*.37,wid*.2,2.4*scale);ctx.restore()}
      function startRace(){if(state.mode!=='ready'&&state.mode!=='finished')return;state.mode='countdown';state.countdown=3;state.time=0;state.raceTime=0;state.speed=0;state.lane=0;state.progress=0;state.hit=0;state.player={progress:0,lane:0,speed:0,color:colors[0]};state.cars=[];for(let i=0;i<5;i++)state.cars.push({progress:.015+i*.018,lane:(i%2?-.25:.25),speed:0,color:colors[i+1],pace:65+i*4,phase:i*1.7,finished:false});intro.style.display='none';document.body.classList.add('racing');countdownEl.textContent='3';countdownEl.className='countdown';statusEl.innerHTML='<b>READY</b> · 比赛即将开始'}
      function endRace(){state.mode='finished';state.gas=state.brake=state.left=state.right=false;document.body.classList.remove('racing');const place=position();intro.style.display='block';intro.querySelector('.eyebrow').textContent='RACE FINISHED / '+formatTime(state.raceTime)+' SEC';intro.querySelector('h1').innerHTML=place===1?'冠军<span>冲线。</span>':'冲过<span>终点。</span>';intro.querySelector('.intro').textContent=`你以第 ${place} 名完成 3 圈比赛，总用时 ${formatTime(state.raceTime)} 秒。再跑一场，刷新自己的最快圈速。`;intro.querySelector('#start').innerHTML='再跑一场 <span class="arrow">↗</span>';statusEl.innerHTML=`<b>FINISH</b> · 第 ${place} 名 · ${formatTime(state.raceTime)} 秒`}
      function position(){const place=1+state.cars.filter(car=>car.progress>state.player.progress).length;return place}
      function keyDown(e){if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','KeyW','KeyS','KeyA','KeyD','Space'].includes(e.code))e.preventDefault();if((e.code==='KeyW'||e.code==='ArrowUp')&&!e.repeat){if(state.mode==='ready'||state.mode==='finished')startRace();state.gas=true}if(e.code==='KeyS'||e.code==='ArrowDown')state.brake=true;if(e.code==='ArrowLeft'||e.code==='KeyA')state.left=true;if(e.code==='ArrowRight'||e.code==='KeyD')state.right=true;if(e.code==='Space')state.handbrake=true}
      function keyUp(e){if(e.code==='KeyW'||e.code==='ArrowUp')state.gas=false;if(e.code==='KeyS'||e.code==='ArrowDown')state.brake=false;if(e.code==='ArrowLeft'||e.code==='KeyA')state.left=false;if(e.code==='ArrowRight'||e.code==='KeyD')state.right=false;if(e.code==='Space')state.handbrake=false}
      addEventListener('keydown',keyDown);addEventListener('keyup',keyUp);addEventListener('blur',()=>{state.gas=state.brake=state.left=state.right=state.handbrake=false});
      function bindHold(id,key){const el=document.querySelector(id);const set=v=>state[key]=v;el.addEventListener('pointerdown',e=>{e.preventDefault();if(key==='gas'&&(state.mode==='ready'||state.mode==='finished'))startRace();set(true);el.setPointerCapture(e.pointerId)});for(const event of ['pointerup','pointercancel','lostpointercapture'])el.addEventListener(event,()=>set(false))}
      bindHold('#gas','gas');bindHold('#brake','brake');bindHold('#left','left');bindHold('#right','right');document.querySelector('#start').addEventListener('click',startRace);
      function update(dt){state.time+=dt;if(state.mode==='countdown'){state.countdown-=dt;const n=Math.ceil(state.countdown);if(n>0)countdownEl.textContent=String(n);else{state.mode='racing';state.raceTime=0;state.raceStart=state.lapStart=performance.now();countdownEl.textContent='GO';countdownEl.classList.add('go');setTimeout(()=>{countdownEl.textContent='';countdownEl.classList.remove('go')},650);statusEl.innerHTML='<b>GO</b> · 抢占内线，开始比赛'}return}if(state.mode!=='racing')return;state.raceTime+=dt*1000;const turn=(state.right?1:0)-(state.left?1:0),player=state.player,old=player.progress;const throttle=state.gas?76:0,braking=state.brake?118:0;player.speed=clamp(player.speed+(throttle-braking-(state.gas?8:16))*dt,0,104);player.lane=clamp(player.lane+turn*dt*(.42+player.speed/104*1.45)*(state.handbrake?1.28:1),-1.12,1.12);if(Math.abs(player.lane)>.82)player.speed=Math.max(0,player.speed-48*dt);let draft=0;for(const car of state.cars){const gap=Math.abs(mod(player.progress-car.progress+.5,1)-.5);if(gap<.022&&Math.abs(player.lane-car.lane)<.32){draft=1;if(player.speed>car.speed)player.speed=Math.max(car.speed,player.speed-54*dt);state.hit=.18}}player.progress+=player.speed*dt/track.length;state.progress=player.progress;state.speed=player.speed;state.lane=player.lane;for(const car of state.cars){car.progress+=car.pace*dt/track.length;car.lane=clamp(Math.sin(state.time*.7+car.phase)*.27,-.35,.35);car.speed=car.pace}state.hit=Math.max(0,state.hit-dt);const lapNow=Math.floor(player.progress)+1;if(player.progress>=LAPS){player.progress=LAPS;state.progress=LAPS;state.raceTime=performance.now()-state.raceStart;const lastLap=performance.now()-state.lapStart;if(lastLap>9000&&(!state.bestLap||lastLap<state.bestLap)){state.bestLap=lastLap;try{localStorage.setItem('volt-race-best-lap',String(state.bestLap))}catch{}}bestEl.innerHTML=formatTime(state.bestLap)+'<em>SEC</em>';endRace();return}lapEl.innerHTML=String(Math.min(lapNow,LAPS)).padStart(2,'0')+'<em>/03</em>';positionEl.innerHTML=String(position()).padStart(2,'0')+'<em>/06</em>';speedEl.innerHTML=String(Math.round(player.speed*2.15)).padStart(3,'0')+'<em>KM/H</em>';bestEl.innerHTML=state.bestLap?formatTime(state.bestLap)+'<em>SEC</em>':'--<em>SEC</em>';if(Math.floor(old)!==Math.floor(player.progress)&&player.progress>old){const lapTime=(performance.now()-state.lapStart);if(lapTime>9000&&(!state.bestLap||lapTime<state.bestLap)){state.bestLap=lapTime;try{localStorage.setItem('volt-race-best-lap',String(lapTime))}catch{}}state.lapStart=performance.now()}statusEl.innerHTML=`<b>${Math.round(player.speed*2.15)} KM/H</b> · ${Math.abs(player.lane)>.82?'出界减速，回到路面':draft?'尾流加速，准备超车':state.handbrake?'手刹漂移中':state.gas?'全油门，保持走线':'松开油门会减速'}`}
      function draw(){drawBackground();drawTrack();const all=[...state.cars,state.player].filter(Boolean).sort((a,b)=>a.progress-b.progress);for(const car of all)drawCar(car,car===state.player);if(state.hit>0){ctx.fillStyle=`rgba(255,70,80,${state.hit*.42})`;ctx.fillRect(0,0,state.w,state.h)}}
      function frame(ms){const dt=Math.min(.04,(ms-state.last)/1000||0);state.last=ms;update(dt);draw();requestAnimationFrame(frame)}
      addEventListener('resize',resize);resize();state.player={progress:0,lane:0,speed:0,color:colors[0]};state.cars=[{progress:.015,lane:-.2,speed:0,color:colors[1]},{progress:.033,lane:.2,speed:0,color:colors[2]},{progress:.051,lane:-.2,speed:0,color:colors[3]},{progress:.069,lane:.2,speed:0,color:colors[4]},{progress:.087,lane:0,speed:0,color:colors[5]}];bestEl.innerHTML=state.bestLap?formatTime(state.bestLap)+'<em>SEC</em>':'--<em>SEC</em>';requestAnimationFrame(frame);
    })();
  </script>
